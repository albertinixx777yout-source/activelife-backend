{% extends "dashboard/base.html" %}
{% block content %}
    <!-- Navbar / Header Superior -->
    <header class="flex items-center justify-between px-6 py-4 bg-white border-b dark:bg-gray-800 dark:border-gray-700">
        <div class="flex items-center">
            <button class="p-1 mr-5 -ml-1 rounded-md md:hidden focus:outline-none focus:shadow-outline-purple" aria-label="Menu">
                <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
            </button>
            <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200">Visión General</h2>
        </div>
        <div class="flex items-center">
            <div class="relative">
                <button class="flex items-center focus:outline-none">
                    <img class="object-cover w-8 h-8 rounded-full" src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff" alt="" aria-hidden="true" />
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido scrolleable -->
    <div class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 dark:bg-gray-900">
        <div class="container px-6 mx-auto grid">
            {% include "./content/data.html" %}
        </div>
    </div>
{% endblock %}
