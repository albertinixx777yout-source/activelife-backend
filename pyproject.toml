[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "main"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "pydantic>=2.8.2",
    "python-dotenv>=1.0.1",
    "supabase>=2.5.0"
]

[tool.setuptools]
packages = ["models", "routers"]
py-modules = ["main", "database"]

[tool.fastapi]
entrypoint = "main:app"
